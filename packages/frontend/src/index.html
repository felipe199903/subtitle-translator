  <link rel="canonical" href="https://subtitle-translator.com.br/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tradutor de Legendas">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://subtitle-translator.com.br/">
  <meta property="og:title" content="Tradutor de Legendas — legendas em português, prontas em segundos">
  <meta property="og:description" content="Traduza legendas .srt do inglês para o português (BR), revise e baixe o arquivo pronto.">
  <meta property="og:image" content="https://subtitle-translator.com.br/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Tradutor de Legendas",
    "url": "https://subtitle-translator.com.br/",
    "description": "Traduza legendas .srt do inglês para o português do Brasil, revise fala por fala e baixe o arquivo pronto.",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Web",
    "inLanguage": "pt-BR",
    "image": "https://subtitle-translator.com.br/og-image.png",
    "offers": [
      { "@type": "Offer", "name": "Grátis", "price": "0", "priceCurrency": "BRL" },
      { "@type": "Offer", "name": "Pro Mensal", "price": "19.90", "priceCurrency": "BRL" },
      { "@type": "Offer", "name": "Pro 12 meses", "price": "179.00", "priceCurrency": "BRL" }
    ]
  }
  </script>
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
  <script>
    // Apply the saved theme before the first paint (avoids a light/dark flash).
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
